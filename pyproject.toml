[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "droid"
authors = [
    {name = "Alexander Khazatsky "}
]
description = "Distributed Robot Interaction Dataset"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.7"
keywords = ["robotics"]
dependencies = [
    "absl-py",
    "aiohttp",
    "black",
    "einops",
    "fastapi",
    "gdown",
    "grpcio>=1.32.0",
    "gym",
    "h5py>=3.0.0",
    "imageio",
    "lark",
    "matplotlib",
    "mcap>=1.0.0",
    "numpy>=1.18.5",
    "opencv-python==4.5.5.64",
    "packaging",
    "pandas",
    "Pillow",
    "pybullet",
    "pyquaternion",
    "pytest",
    "pytest-repeat",
    "pytest-timeout",
    "python-multipart",
    "scikit-image",
    "scipy>=1.2.1",
    "setuptools>=42",
    "seaborn",
    "tensorboard",
    "torch>=1,!=1.12.0,<2",
    "tqdm",
    "uvicorn",
    "yacs",
    "zstandard",
    "lz4",
]

[project.optional-dependencies]
dev = [
    "black[jupyter]",
    "ipython",
    "pre-commit",
    "ruff",
]
postprocessing = [
    "scikit-image",
]

[project.urls]
homepage = "https://github.com/droid-dataset/droid"
repository = "https://github.com/droid-dataset/droid"
documentation = "https://github.com/droid-dataset/droid"

[tool.black]
line-length = 121
target-version = ["py37", "py38", "py39", "py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py38"
select = ["A", "B", "C90", "E", "F", "I", "RUF", "W"]
ignore = ["F405", "B006", "C901", "F403", "E722"]
[tool.ruff.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.isort]
profile = "black"
line_length = 121
skip = ["__init__.py"]
filter_files = true
py_version = "all"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["cache"]
