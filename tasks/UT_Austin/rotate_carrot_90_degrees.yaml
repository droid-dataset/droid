institution: University of Texas at Austin
task_id: rotate_carrot_90_degrees
language_instruction: Rotate the carrot by 90 degrees.
success_criteria: |
  The carrot is rotated approximately 90 degrees from its starting orientation.
max_timesteps: 300
# Milestones are cumulative and must be ordered so that reaching milestone N
# implies all earlier milestones were also reached. The operator picks a single
# "highest milestone reached" after each rollout.
milestones:
  - name: reached_carrot
    description: Gripper made contact with the carrot.
  - name: began_rotating_carrot
    description: Carrot orientation changed noticeably from its starting orientation.
  - name: rotated_90_degrees
    description: Carrot was rotated approximately 90 degrees from its starting orientation.
